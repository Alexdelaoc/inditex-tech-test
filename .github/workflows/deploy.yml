name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - name: Comprobar secrets
        run: |
          fail=
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            val="${!v}"
            if [ -z "$val" ]; then
              echo "::error::Falta el secret $v"
              fail=1
            else
              echo "$v presente (${#val} caracteres)"
            fi
          done
          [ -z "$fail" ]

      - name: Configuración de Vercel
        run: pnpm dlx vercel pull --yes --environment=production

      - name: Build
        run: pnpm dlx vercel build --prod

      - name: Desplegar
        run: |
          url=$(pnpm dlx vercel deploy --prebuilt --prod)
          echo "Desplegado en $url" >> "$GITHUB_STEP_SUMMARY"
